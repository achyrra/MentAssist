services:
  
  # PostgreSQL database
  db:
    image: postgres:16
    container_name: mentassistdb # removed dash from name mentassist-db
    restart: unless-stopped
    env_file:
      - ./mentassistdb/.env
    expose:
      - "5432"
    volumes:
      - mentassist_pgdata:/var/lib/postgresql/data
      - ./mentassistdb/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./mentassistdb/db/roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
      - ./mentassistdb/scripts/seed_dev.sql:/docker-entrypoint-initdb.d/03_seed.sql # seed login data for dev state 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentassist-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # Frontend (frontend team needs to fill  in src/)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentassist-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  # Nginx reverse proxy
  # This will be the ONLY container with a port exposed to the host.
  nginx:
    image: nginx:1.27-alpine
    container_name: mentassist-nginx
    restart: unless-stopped
    ports:
      - "80:80"         # for dev only -> no TLS here yet
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/sites-enabled/app.conf:/etc/nginx/conf.d/app.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  mentassist_pgdata:

networks:
  internal:
    driver: bridge