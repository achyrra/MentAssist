services:
  db:
    image: postgres:16
    container_name: mentassist-db
    restart: unless-stopped
    env_file:
      - ./mentassistdb/.env
    expose:
      - "5432"
    volumes:
      - mentassist_pgdata:/var/lib/postgresql/data
      - ./mentassistdb/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./mentassistdb/db/roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentassist-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mentassist_pgdata: