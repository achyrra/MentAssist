server {
    listen 80;
    server_name localhost;

    # Security headers (baseline — expand for prod)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # API — proxy to FastAPI backend
    location /api/ {
        # Rate limit: 30 req/min per IP, burst of 10 with no delay
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Don't expose internal error details
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Health check passthrough (unauthenticated, excluded from rate limit)
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Frontend — served from the frontend container
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Support client-side routing (SPA fallback)
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # Generic error pages
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
