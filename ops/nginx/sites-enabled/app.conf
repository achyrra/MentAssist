server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    #---------Security Headers---------
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS (HTTP Strict Transport Security); enforce for 1 year and apply to subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP (content security policy)
    # default-src   — fallback for all resource types not explicitly listed
    # script-src    — only allow scripts from self and inline scripts (for React development mode) -> this relaxes the policy for development; SHOULD BE TIGHTENED IN PROD
    # style-src     — allow styles from self, Google Fonts, and inline styles (for React development mode) -> this relaxes the policy for development; SHOULD BE TIGHTENED IN PROD
    # font-src      — allow fonts from self and Google Fonts CDN
    # img-src       — allow images from self and data URIs (for inline SVGs/avatars)
    # connect-src   — allow API calls back to self only
    # frame-src     — disallow all iframes
    # object-src    — disallow plugins (Flash, etc.)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
    " always;

    # API — proxy to FastAPI backend
    location /api/ {
        # rate limit
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # hide internal headers
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Health Check 
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend 
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SPA fallback, index
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # Generic Error Pages
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}